<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Practice Webpage</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header -->
    <div class="header">
        <h1>Student Practice Webpage</h1>
        <p>HTML + CSS Practice (Forms + Table Advanced)</p>
    </div>

   
    <div class="section">
        <h2>Image Section</h2>

        <div class="img-box">
            <img src="/image/image.png" alt="">
        </div>
    </div>


    <div class="section">
        <h2>Image Circle</h2>

        <img src="/image/image.png" class="circle">
    </div>

   
    <div class="section">
        <h2>Image Oval</h2>

        <img src="/image/image.png" class="oval">
    </div>
    <!-- Image Section -->
    <div class="section">
        <h2>Image Oval</h2>

        <img src="/image/image.png" class="oval">
    </div>
  
    <div class="section">

        <h2>Advanced Table</h2>

        <table>
            <tr>
                <th rowspan="2">Name</th>
                <th colspan="2">Scores</th>
                <th rowspan="2">Grade</th>
            </tr>

            <tr>
                <th>Math</th>
                <th>CS</th>
            </tr>

            <tr>
                <td>Alice</td>
                <td>90</td>
                <td>95</td>
                <td>A</td>
            </tr>

            <tr>
                <td>Bob</td>
                <td>80</td>
                <td>85</td>
                <td>B</td>
            </tr>
        </table>
    </div>

    
    <div class="section">
        <form>
            <h2>Form 1: Basic Info</h2>

            <label>Name *</label>
            <input type="text" required>

            <label>Email *</label>
            <input type="email" required>

            <label>Password *</label>
            <input type="password" required>

            <label>Upload File</label>
            <input type="file">

            <button type="submit">Submit</button>
            <button type="reset">Reset</button>
        </form>
    </div>


    <div class="section">
        <form>
            <h2>Form 2: Survey Form</h2>

            <label>Choose Course *</label>

            <select required>
                <option>-- Select --</option>
                <option>HTML</option>
                <option>CSS</option>
                <option>JavaScript</option>
            </select>

            <label>Gender</label>

            <div class="radio-group">
                <input type="radio" name="gender"> Male
                <input type="radio" name="gender"> Female
            </div>

            <label>Skills</label>

            <div class="check-group">
                <input type="checkbox"> HTML
                <input type="checkbox"> CSS
                <input type="checkbox"> JS
            </div>

            <label>Phone *</label>
            <input type="tel" required>

            <label>Message</label>
            <textarea rows="5"></textarea>

            <button type="submit">Send</button>
        </form>
    </div>

</body>
</html>
